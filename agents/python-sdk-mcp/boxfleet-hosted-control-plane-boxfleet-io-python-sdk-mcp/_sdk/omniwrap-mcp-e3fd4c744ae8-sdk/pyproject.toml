[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omniwrap-mcp-e3fd4c744ae8-sdk"
version = "0.3.0"
description = "Routes served by the boxfleet.io Worker."
license = { file = "LICENSE" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["httpx>=0.24,<1", "typing_extensions>=4.2.0"]
keywords = ["openapi", "sdk", "httpx", "api-client", "box", "fleet", "hosted", "control", "plane", "boxfleet", "io"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["omniwrap_mcp_e3fd4c744ae8_sdk*"]

[tool.setuptools.package-data]
omniwrap_mcp_e3fd4c744ae8_sdk = ["py.typed"]

[tool.setuptools.data-files]
"share/omniwrap/omniwrap_mcp_e3fd4c744ae8_sdk" = ["api.md", "omniwrap-artifact.json"]

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# PEP 604 unions stay spelled Optional[...]/Union[...] so every annotation remains
# evaluable (typing.get_type_hints) on the oldest supported interpreter.
ignore = ["UP007", "UP045"]

[tool.mypy]
strict = true
